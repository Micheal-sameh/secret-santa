services:

  # ── PHP-FPM application ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/var/www/html/storage
    ports:
      - "1500:9000"
    networks:
      - santa

volumes:
  storage_data:

networks:
  santa:
    driver: bridge