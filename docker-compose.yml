version: '3.8'

services:

  # ── PHP-FPM application ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    ports:
      - "9000:9000"
    networks:
      - santa

volumes:
  storage_data:

networks:
  santa:
    driver: bridge